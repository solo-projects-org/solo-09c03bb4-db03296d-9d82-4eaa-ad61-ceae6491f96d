services:
  cohort-api:
    build: .
    image: cohort-cr-api:1.0.0
    container_name: cohort-cr-api
    ports:
      - "8000:8000"
    environment:
      COHORT_DB_PATH: /data/cohort.db
      COHORT_UPLOAD_DIR: /data/uploads
      COHORT_HORIZON_DAYS: "30"
      COHORT_MAX_UPLOAD_BYTES: "52428800"
    volumes:
      - cohort-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cohort-data:
